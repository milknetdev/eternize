name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc -b
      - name: Unit / API tests
        run: npm test
      - name: Production build (same steps as Vercel)
        run: npm run build:ci
